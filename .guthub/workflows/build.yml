name: Build NightShift Installers

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish a GitHub Release when you push a v* tag

env:
  VERSION: 1.3.0

jobs:
  # ---------------------------------------------------------------- Windows
  windows:
    name: Windows (VST3 + Standalone installer)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64   # uses whichever Visual Studio the runner has

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Install Inno Setup (if missing)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }

      - name: Build installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppVersion=${env:VERSION}" `
            "/DBuildDir=${{ github.workspace }}\build\NightShift_artefacts\Release" `
            "/DOutputDir=${{ github.workspace }}\dist" `
            installer\windows\NightShift.iss

      - uses: actions/upload-artifact@v4
        with:
          name: NightShift-Windows-Installer
          path: dist/*.exe

  # ---------------------------------------------------------------- macOS
  macos:
    name: macOS (VST3 + AU + Standalone .pkg, Universal)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Build installer
        run: |
          chmod +x installer/mac/build_pkg.sh installer/mac/scripts/postinstall
          installer/mac/build_pkg.sh "$VERSION" build/NightShift_artefacts/Release dist

      - name: Validate Audio Unit (informational)
        continue-on-error: true
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/NightShift_artefacts/Release/AU/NightShift.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 5
          auval -v aumu Nsy1 Nsft

      - uses: actions/upload-artifact@v4
        with:
          name: NightShift-macOS-Installer
          path: dist/*.pkg

  # ---------------------------------------------------------------- Linux (tests)
  linux-tests:
    name: Linux (render tests + VST3)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev \
            libxrender-dev libgl1-mesa-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DNS_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run render tests (every preset, NaN/silence/fuzz/state checks)
        run: ./build/NightShiftTests_artefacts/Release/NightShiftTests

      - name: Package Linux VST3
        run: |
          mkdir -p dist
          cd build/NightShift_artefacts/Release/VST3
          tar -czf "$GITHUB_WORKSPACE/dist/NightShift-$VERSION-Linux-VST3.tar.gz" NightShift.vst3

      - uses: actions/upload-artifact@v4
        with:
          name: NightShift-Linux-VST3
          path: dist/*.tar.gz

  # ---------------------------------------------------------------- Release
  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [ windows, macos, linux-tests ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
